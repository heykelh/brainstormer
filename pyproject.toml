[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brainstormer"
version = "0.1.0"
description = "Agent IA qui scrute GitHub et Hacker News pour proposer des idées d'apps fondées sur de vrais besoins."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rigobert" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
brainstormer = "brainstormer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brainstormer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
